<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/jpeg" href="/leo_favicon.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Leo Joseph — Bioinformatics MS student at UC San Diego building deep learning methods for microbiome analysis and cancer genomics." />
    <meta property="og:title" content="Leo Joseph" />
    <meta property="og:description" content="Bioinformatics MS student at UC San Diego. Building deep learning methods for microbiome analysis and cancer genomics." />
    <meta property="og:type" content="website" />
    <!-- No-flash theme script: runs before any content renders -->
    <script>
      (function () {
        var t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
